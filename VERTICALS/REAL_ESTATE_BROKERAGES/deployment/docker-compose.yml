# Per-client brokerage stack.
# Usage:
#   docker compose -f DEPLOYMENT_INFRASTRUCTURE/docker/docker-compose.master.yml \
#     -f VERTICALS/REAL_ESTATE_BROKERAGES/deployment/docker-compose.yml up -d
version: "3.9"

services:
  api:
    environment:
      VERTICAL: real_estate_brokerages
      CLIENT_ID: "${CLIENT_ID}"

  worker:
    environment:
      VERTICAL: real_estate_brokerages
      CLIENT_ID: "${CLIENT_ID}"
