# Per-client clinic stack: extends the master compose services.
# Usage (from repo root):
#   docker compose -f DEPLOYMENT_INFRASTRUCTURE/docker/docker-compose.master.yml \
#     -f VERTICALS/MEDICAL_DENTAL_CLINICS/deployment/docker-compose.yml up -d
version: "3.9"

services:
  api:
    environment:
      VERTICAL: medical_dental_clinics
      CLIENT_ID: "${CLIENT_ID}"
      CALENDAR_MODE: "${CALENDAR_MODE:-google}"   # google | pms | dual
      INSURANCE_VENDOR: "${INSURANCE_VENDOR:-stedi}"

  worker:
    environment:
      VERTICAL: medical_dental_clinics
      CLIENT_ID: "${CLIENT_ID}"
    deploy:
      replicas: 1

  # Inbound phone number handling (Twilio -> API)
