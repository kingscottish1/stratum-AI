apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-agent
  namespace: stratum
  labels:
    app: clinic-agent
    vertical: medical_dental_clinics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinic-agent
  template:
    metadata:
      labels:
        app: clinic-agent
        vertical: medical_dental_clinics
    spec:
      containers:
        - name: clinic-agent
          image: ${ECR_REGISTRY}/agent-core:${IMAGE_TAG}
          env:
            - name: VERTICAL
              value: medical_dental_clinics
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: clinic-config
                  key: client_id
          envFrom:
            - configMapRef:
                name: clinic-config
            - secretRef:
                name: clinic-secrets
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinic-config
  namespace: stratum
data:
  client_id: "CHANGE_ME"
  calendar_mode: "google"
  insurance_vendor: "stedi"
  reminder_hours: "48,24"
  no_show_window_hours: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: clinic-agent
  namespace: stratum
spec:
  selector:
    app: clinic-agent
  ports:
    - port: 80
      targetPort: 8000
