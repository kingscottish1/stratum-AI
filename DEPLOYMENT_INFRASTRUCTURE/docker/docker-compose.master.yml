# Master compose: full stratum platform (dev/self-hosted single-node).
# Per-client stacks (VERTICALS/*/deployment/docker-compose.yml) add the
# vertical-specific services on top of this.
version: "3.9"

x-agent-env: &agent-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+psycopg2://agent:agent@postgres:5432/stratum

services:
  api:
    build:
      context: ../..
      dockerfile: DEPLOYMENT_INFRASTRUCTURE/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment: *agent-env
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: DEPLOYMENT_INFRASTRUCTURE/docker/Dockerfile.worker
    environment: *agent-env
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    deploy:
      replicas: 2

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: stratum
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../../DEPLOYMENT_INFRASTRUCTURE/monitoring/prometheus_config.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../../DEPLOYMENT_INFRASTRUCTURE/monitoring/grafana_dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
