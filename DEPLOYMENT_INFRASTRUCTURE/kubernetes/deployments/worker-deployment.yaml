apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: stratum
  labels:
    app: agent-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app: agent-worker
    spec:
      containers:
        - name: agent-worker
          image: ${ECR_REGISTRY}/agent-worker:${IMAGE_TAG}
          envFrom:
            - configMapRef:
                name: stratum-config
            - secretRef:
                name: stratum-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1.5Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
