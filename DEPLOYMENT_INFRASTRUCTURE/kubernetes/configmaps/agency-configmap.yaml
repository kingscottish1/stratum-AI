apiVersion: v1
kind: ConfigMap
metadata:
  name: stratum-config
  namespace: stratum
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis-master.stratum.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql+psycopg2://agent:${DB_PASSWORD}@stratum-db.stratum.svc.cluster.local:5432/stratum"
  DEFAULT_TIMEZONE: "America/Denver"
  FAST_MODEL: "gpt-4o-mini"
  QUALITY_MODEL: "gpt-4o"
