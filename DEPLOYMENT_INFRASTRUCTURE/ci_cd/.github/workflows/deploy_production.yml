name: Deploy Production

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: stratum-eks

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4

      - name: Tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          IMG="${{ steps.ecr.outputs.registry }}/agent-core:${{ steps.tag.outputs.version }}"
          docker build -f DEPLOYMENT_INFRASTRUCTURE/docker/Dockerfile.agent-core -t "$IMG" .
          docker push "$IMG"

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/agent-core agent-core=${{ steps.ecr.outputs.registry }}/agent-core:${{ steps.tag.outputs.version }} -n stratum
          kubectl rollout status deployment/agent-core -n stratum --timeout=5m
          kubectl rollout status deployment/agent-worker -n stratum --timeout=5m

      - name: Run DB migrations
        run: |
          kubectl exec deploy/agent-core -n stratum -- python -m CORE_AGENT_INFRASTRUCTURE.workers.migrate
