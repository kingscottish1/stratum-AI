name: Test & Build

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r CORE_AGENT_INFRASTRUCTURE/frameworks/langchain_setup/requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint
        run: ruff check CORE_AGENT_INFRASTRUCTURE VERTICALS

      - name: Compile check
        run: python -m compileall -q CORE_AGENT_INFRASTRUCTURE VERTICALS

      - name: Tests
        run: pytest tests/ -q --cov=VERTICALS --cov=CORE_AGENT_INFRASTRUCTURE --cov-report=term-missing

  build-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agent-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DEPLOYMENT_INFRASTRUCTURE/docker/Dockerfile.agent-core
          tags: ghcr.io/${{ github.repository }}/agent-core:${{ github.sha }}
          push: false
