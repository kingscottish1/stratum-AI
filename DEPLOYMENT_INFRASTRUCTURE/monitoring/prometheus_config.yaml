global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "stratum-api"
    metrics_path: /v1/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "stratum-workers"
    static_configs:
      - targets: ["worker:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

rule_files:
  - /etc/prometheus/alerting_rules.yaml
